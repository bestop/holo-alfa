
# The name of your website.
name: 童声传递

description:

  # Description of your site. This will show up in google.
  meta: 每个孩子都是独一无二的小星星，而父母的爱与陪伴，就是点亮他们成长之路的温柔光芒。这里没有生硬的说教，只有无数家庭用爱与耐心写下的育儿日记——从第一声啼哭到第一次独立，从亲子共读的温馨时光到共同克服的小挑战。我们在这里分享欢笑与泪水，交换智慧与感动，让每一份育儿经验都化作滋养心灵的养分，陪伴你和孩子一起，慢慢长大，慢慢爱。

  # Description of your site. This will show up on the front page.
  subtitle: 专注亲子教育经验分享的温暖社区。通过真实育儿故事、实用技巧和专家指导，搭建父母与孩子共同成长的桥梁，让教育成为双向滋养的旅程。
